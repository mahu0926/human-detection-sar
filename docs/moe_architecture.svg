<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="920" viewBox="0 0 1900 920" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="1900" height="920" fill="#ffffff"/>

  <text x="40" y="50" font-size="30" font-weight="700" fill="#111827">Terrain-Gated Mixture of Experts for Drone SAR Human Detection</text>

  <!-- Input -->
  <rect x="40" y="300" width="210" height="190" rx="12" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="145" y="350" font-size="21" font-weight="700" text-anchor="middle" fill="#111827">Drone image</text>
  <text x="145" y="380" font-size="15" text-anchor="middle" fill="#374151">full resolution</text>
  <text x="145" y="402" font-size="15" text-anchor="middle" fill="#374151">(1920×1080 – 5456×3632)</text>
  <text x="145" y="450" font-size="14" text-anchor="middle" fill="#6b7280">RGB, any terrain</text>

  <!-- Gate lane -->
  <text x="310" y="98" font-size="15" font-weight="700" fill="#7c3aed" letter-spacing="1">GATE (low-res copy)</text>
  <rect x="310" y="112" width="240" height="120" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="430" y="147" font-size="18" font-weight="700" text-anchor="middle" fill="#111827">Preprocess</text>
  <text x="430" y="174" font-size="14" text-anchor="middle" fill="#374151">short side → 320 → 256</text>
  <text x="430" y="195" font-size="14" text-anchor="middle" fill="#374151">center crop 224×224</text>
  <text x="430" y="216" font-size="13" text-anchor="middle" fill="#6b7280">(+5-crop TTA optional)</text>

  <rect x="590" y="112" width="260" height="120" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="720" y="147" font-size="18" font-weight="700" text-anchor="middle" fill="#111827">CNN Gate</text>
  <text x="720" y="174" font-size="14" text-anchor="middle" fill="#374151">MobileNetV3-Large</text>
  <text x="720" y="195" font-size="14" text-anchor="middle" fill="#374151">ImageNet-pretrained</text>
  <text x="720" y="216" font-size="14" text-anchor="middle" fill="#374151">3-class head</text>

  <rect x="890" y="112" width="200" height="120" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="990" y="147" font-size="18" font-weight="700" text-anchor="middle" fill="#111827">Softmax</text>
  <text x="990" y="174" font-size="14" text-anchor="middle" fill="#2563eb">p(maritime)</text>
  <text x="990" y="195" font-size="14" text-anchor="middle" fill="#ea580c">p(urban)</text>
  <text x="990" y="216" font-size="14" text-anchor="middle" fill="#16a34a">p(vegetation)</text>

  <path d="M250,340 C280,340 275,172 308,172" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="550" y1="172" x2="588" y2="172" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="850" y1="172" x2="888" y2="172" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="990" y1="232" x2="990" y2="363" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="1002" y="300" font-size="13" fill="#7c3aed">probabilities</text>

  <!-- Full-res path into router -->
  <line x1="250" y1="455" x2="858" y2="455" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="290" y="443" font-size="14" fill="#374151">full-resolution original image (never resized by the gate)</text>

  <!-- Router -->
  <rect x="860" y="365" width="260" height="190" rx="12" fill="#fff7ed" stroke="#374151" stroke-width="2.5"/>
  <text x="990" y="402" font-size="20" font-weight="700" text-anchor="middle" fill="#111827">Router</text>
  <text x="990" y="432" font-size="14" text-anchor="middle" fill="#374151">send image to the expert</text>
  <text x="990" y="452" font-size="14" text-anchor="middle" fill="#374151">with the highest p</text>
  <line x1="885" y1="472" x2="1095" y2="472" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="990" y="496" font-size="13" text-anchor="middle" fill="#6b7280">top2 mode: if max p &lt; 0.75,</text>
  <text x="990" y="515" font-size="13" text-anchor="middle" fill="#6b7280">also run the 2nd-best expert</text>
  <text x="990" y="540" font-size="13" text-anchor="middle" fill="#6b7280">3 routes</text>

  <!-- Three routes -->
  <path d="M1120,400 L1134,400 L1134,332 L1218,332" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/>
  <text x="1143" y="324" font-size="14" font-weight="700" fill="#2563eb">maritime</text>
  <line x1="1120" y1="460" x2="1218" y2="460" stroke="#ea580c" stroke-width="3" marker-end="url(#ao)"/>
  <text x="1140" y="450" font-size="14" font-weight="700" fill="#ea580c">urban</text>
  <path d="M1120,520 L1134,520 L1134,588 L1218,588" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#agr)"/>
  <text x="1140" y="580" font-size="14" font-weight="700" fill="#16a34a">vegetation</text>

  <!-- Experts -->
  <text x="1220" y="272" font-size="15" font-weight="700" fill="#374151" letter-spacing="1">EXPERTS (run on full-res image)</text>
  <rect x="1220" y="285" width="330" height="95" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="1240" y="316" font-size="17" font-weight="700" fill="#1e3a8a">Expert 1 · Maritime</text>
  <text x="1240" y="341" font-size="14" fill="#374151">YOLOv5 · VisDrone → SeaDronesSee</text>
  <text x="1240" y="363" font-size="13" fill="#6b7280">Mahati</text>

  <rect x="1220" y="413" width="330" height="95" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="1240" y="444" font-size="17" font-weight="700" fill="#7c2d12">Expert 2 · Urban</text>
  <text x="1240" y="469" font-size="14" fill="#374151">YOLOv5 · VisDrone → NTIC</text>
  <text x="1240" y="491" font-size="13" fill="#6b7280">Adi</text>

  <rect x="1220" y="541" width="330" height="95" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1240" y="572" font-size="17" font-weight="700" fill="#14532d">Expert 3 · Vegetation</text>
  <text x="1240" y="597" font-size="14" fill="#374151">YOLOv5 · VisDrone → Heridal</text>

  <!-- Experts to merge -->
  <line x1="1550" y1="332" x2="1590" y2="332" stroke="#374151" stroke-width="2"/>
  <line x1="1550" y1="460" x2="1590" y2="460" stroke="#374151" stroke-width="2"/>
  <line x1="1550" y1="588" x2="1590" y2="588" stroke="#374151" stroke-width="2"/>
  <line x1="1590" y1="332" x2="1590" y2="588" stroke="#374151" stroke-width="2"/>
  <line x1="1590" y1="400" x2="1618" y2="400" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- Merge + output -->
  <rect x="1620" y="345" width="240" height="110" rx="12" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="1740" y="380" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">Merge</text>
  <text x="1740" y="405" font-size="13" text-anchor="middle" fill="#374151">only if 2 experts ran</text>
  <text x="1740" y="426" font-size="13" text-anchor="middle" fill="#374151">NMS, IoU 0.5 (WBF opt.)</text>
  <line x1="1740" y1="455" x2="1740" y2="493" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <rect x="1620" y="495" width="240" height="125" rx="12" fill="#111827"/>
  <text x="1740" y="533" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Output</text>
  <text x="1740" y="560" font-size="13" text-anchor="middle" fill="#e5e7eb">human boxes + scores</text>
  <text x="1740" y="581" font-size="13" text-anchor="middle" fill="#e5e7eb">routed expert</text>
  <text x="1740" y="602" font-size="13" text-anchor="middle" fill="#e5e7eb">gate probabilities</text>

  <!-- Footer -->
  <rect x="40" y="700" width="890" height="185" rx="12" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="62" y="733" font-size="17" font-weight="700" fill="#5b21b6">Gate training data (label = terrain of source dataset)</text>
  <text x="62" y="764" font-size="15" fill="#2563eb">● Maritime: SeaDronesSee v2 — 8,930 train</text>
  <text x="62" y="790" font-size="15" fill="#ea580c">● Urban: NTIC 1,277 + VisDrone2019-DET 6,471 train</text>
  <text x="62" y="816" font-size="15" fill="#16a34a">● Vegetation: Heridal — 1,106 train</text>
  <text x="62" y="848" font-size="14" fill="#374151">Inverse-frequency weighted sampler · crop / flip / color jitter / JPEG &amp; resolution aug</text>
  <text x="62" y="869" font-size="14" fill="#374151">AdamW + cosine LR · early stop on val macro-F1</text>

  <rect x="970" y="700" width="890" height="185" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="992" y="733" font-size="17" font-weight="700" fill="#111827">Gate results</text>
  <text x="992" y="766" font-size="15" fill="#111827">Test accuracy: <tspan font-weight="700">99.85%</tspan> (1,294 / 1,296)</text>
  <text x="992" y="792" font-size="15" fill="#374151">Per-class F1 — maritime 1.000 · urban 0.997 · vegetation 0.994</text>
  <text x="992" y="818" font-size="15" fill="#374151">VisDrone val (unseen): <tspan font-weight="700">100%</tspan> routed urban (61.5% before adding VisDrone)</text>
  <text x="992" y="850" font-size="13" fill="#6b7280">Caveat: test splits are in-domain; NTIC splits share source videos.</text>
  <text x="992" y="870" font-size="13" fill="#6b7280">Experts are trained independently; the gate only decides which to run.</text>
</svg>
